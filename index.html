<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-address-book"></i> Contact Manager</h1>
            <p>Manage your contacts efficiently</p>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <button id="addContactBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add New Contact
                </button>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search contacts...">
                    <i class="fas fa-search"></i>
                </div>
                <div class="contact-list" id="contactList">
                    <!-- Contacts will be dynamically added here -->
                </div>
            </div>

            <div class="contact-details" id="contactDetails">
                <div class="empty-state">
                    <i class="fas fa-user-friends"></i>
                    <h3>No Contact Selected</h3>
                    <p>Select a contact from the list or add a new one</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Contact Form Modal -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Contact</h2>
                <span class="close">&times;</span>
            </div>
            <form id="contactForm">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-group">
                    <label for="company">Company</label>
                    <input type="text" id="company" name="company">
                </div>
                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" name="notes" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" id="saveBtn" class="btn btn-primary">Save Contact</button>
                    <button type="button" id="deleteBtn" class="btn btn-danger" style="display: none;">Delete Contact</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content confirm-modal">
            <h3>Confirm Deletion</h3>
            <p>Are you sure you want to delete this contact? This action cannot be undone.</p>
            <div class="confirm-actions">
                <button id="confirmCancel" class="btn btn-secondary">Cancel</button>
                <button id="confirmDelete" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script type="module" src="./dist/app.js"></script>

</body>
</html>
